name: CI

on:
  push:
  pull_request:

jobs:

  php:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update

      - name: Run tests
        run: composer test

  node:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  phpunit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mediawiki
    steps:

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:2

      - name: Clone MediaWiki
        working-directory: .
        run: git clone --depth 1 -b REL1_47 https://gerrit.wikimedia.org/r/mediawiki/core.git mediawiki

      - name: Install dependencies
        run: composer update

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: mediawiki/extensions/${{ github.event.repository.name }}

      - name: Composer require
        run: |
          REPO="${{ github.event.repository.name }}"
          PACKAGE="${REPO#mwstake-}"
          composer config repositories."$REPO" '{"type":"path","url":"extensions/'"$REPO"'","options":{"symlink":false}}'
          composer require "mwstake/${PACKAGE}:@dev"

      - name: Create LocalSettings.php
        run: echo '<?php $wgServer = "";' > LocalSettings.php

      - name: Run tests
        run: composer phpunit:unit -- --colors=always "extensions/${{ github.event.repository.name }}/tests/phpunit/unit" --exclude-group Broken,ParserFuzz,Stub
